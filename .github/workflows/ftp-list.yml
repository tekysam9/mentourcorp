name: FTP cleanup (temporary)
on: workflow_dispatch
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y lftp >/dev/null
      - env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$U,$P" -e "set ssl:verify-certificate no; rm public_html/.ftp-deploy-sync-state.json; rm public_html/index.html; rmdir public_html; echo AFTER; cls -l; bye" "$H"
